# Optional overlay: include only when explicitly setting up local S3 storage.
# Starting this service does not enable an application adapter or create a bucket.
services:
  storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: [storage]
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set a unique development MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set a generated development MINIO_ROOT_PASSWORD}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - object-data:/data
    restart: unless-stopped

volumes:
  object-data:
